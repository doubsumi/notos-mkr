[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "notos-mkr"
version = "0.1.0"
description = "Lightweight mouse & keyboard recorder / replayer with a capsule GUI and MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pynput>=1.7.6",
    "PySide6-Essentials>=6.7",
]

[project.scripts]
notos-mkr = "notos_mkr.cli:main"
notos-mkr-mcp = "notos_mkr.mcp_server:main"

[project.gui-scripts]
notos-mkr-gui = "notos_mkr.gui:run_gui"

[project.urls]
Homepage = "https://github.com/doubsumi/notos-mkr"
Repository = "https://github.com/doubsumi/notos-mkr"
Issues = "https://github.com/doubsumi/notos-mkr/issues"

[tool.setuptools.packages.find]
include = ["notos_mkr*"]
